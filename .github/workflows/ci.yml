name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sintaxe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar os scripts
        run: python -m py_compile discoverySwCisco.py discoverySwHuawei.py
